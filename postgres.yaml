# Secret für PostgreSQL-Credentials
kind: Secret
apiVersion: v1
metadata:
  name: postgres-secret
stringData:
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: securepassword123
  POSTGRES_DB: appdb
---
# PostgreSQL Deployment
kind: Deployment
apiVersion: apps/v1
metadata:
  name: postgres
  labels:
    app: html-openshift-app
    app.kubernetes.io/part-of: html-openshift-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: postgres-secret
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
# PostgreSQL Service (cluster-intern)
kind: Service
apiVersion: v1
metadata:
  name: postgres
  labels:
    app: html-openshift-app
    app.kubernetes.io/part-of: html-openshift-app
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres