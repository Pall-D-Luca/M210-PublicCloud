<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PONG</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050a0e;
      --neon: #00ffe7;
      --neon2: #ff2d78;
      --dim: #0a2a2a;
      --glow: 0 0 8px #00ffe7, 0 0 20px #00ffe780;
      --glow2: 0 0 8px #ff2d78, 0 0 20px #ff2d7880;
    }

    body {
      background: var(--bg);
      color: var(--neon);
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* scanlines overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.15) 3px,
        rgba(0,0,0,0.15) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    h1 {
      font-size: clamp(24px, 5vw, 48px);
      letter-spacing: 0.3em;
      text-shadow: var(--glow);
      margin-bottom: 0.5rem;
      animation: flicker 4s infinite;
    }

    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96% { opacity: 0.6; }
      97% { opacity: 1; }
      98% { opacity: 0.4; }
      99% { opacity: 1; }
    }

    .subtitle {
      font-size: 8px;
      color: #00ffe780;
      letter-spacing: 0.2em;
      margin-bottom: 1.5rem;
    }

    .scoreboard {
      display: flex;
      gap: 4rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    .score-block { text-align: center; }
    .score-label { font-size: 7px; color: #00ffe780; margin-bottom: 0.5rem; letter-spacing: 0.2em; }
    .score-val { font-size: clamp(28px, 4vw, 40px); text-shadow: var(--glow); }
    .score-val.p2 { color: var(--neon2); text-shadow: var(--glow2); }

    .sep { font-size: 24px; color: #ffffff30; }

    .arena-wrap {
      position: relative;
      border: 2px solid var(--neon);
      box-shadow: var(--glow), inset 0 0 40px #00ffe710;
      border-radius: 4px;
    }

    canvas {
      display: block;
      background: var(--bg);
    }

    .controls {
      margin-top: 1.2rem;
      display: flex;
      gap: 2rem;
      font-size: 7px;
      color: #00ffe760;
      letter-spacing: 0.1em;
    }

    .controls span { white-space: nowrap; }
    .key {
      display: inline-block;
      border: 1px solid #00ffe740;
      padding: 2px 5px;
      border-radius: 3px;
      color: var(--neon);
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5,10,14,0.88);
      gap: 1.2rem;
      transition: opacity 0.3s;
    }

    #overlay.hidden { display: none; }

    #overlay-title {
      font-size: clamp(10px, 2vw, 16px);
      text-shadow: var(--glow);
      letter-spacing: 0.2em;
      text-align: center;
      line-height: 2;
    }

    #start-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      background: transparent;
      color: var(--neon);
      border: 2px solid var(--neon);
      padding: 10px 24px;
      cursor: pointer;
      letter-spacing: 0.15em;
      text-shadow: var(--glow);
      box-shadow: var(--glow);
      transition: all 0.15s;
      animation: pulse-btn 1.5s ease-in-out infinite;
    }

    @keyframes pulse-btn {
      0%, 100% { box-shadow: var(--glow); }
      50% { box-shadow: 0 0 16px #00ffe7, 0 0 40px #00ffe7aa; }
    }

    #start-btn:hover {
      background: var(--neon);
      color: var(--bg);
      animation: none;
    }

    #diff-row { display: flex; gap: 1rem; }
    .diff-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      background: transparent;
      color: #00ffe770;
      border: 1px solid #00ffe740;
      padding: 6px 12px;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: all 0.15s;
    }
    .diff-btn.active, .diff-btn:hover {
      color: var(--neon);
      border-color: var(--neon);
      text-shadow: var(--glow);
    }

    .diff-label { font-size: 7px; color: #00ffe760; letter-spacing: 0.15em; }
  </style>
</head>
<body>

  <h1>PONG</h1>
  <p class="subtitle">INSERT COIN — 2 PLAYER LOCAL</p>

  <div class="scoreboard">
    <div class="score-block">
      <div class="score-label">PLAYER 1</div>
      <div class="score-val" id="s1">00</div>
    </div>
    <div class="sep">:</div>
    <div class="score-block">
      <div class="score-label">PLAYER 2</div>
      <div class="score-val p2" id="s2">00</div>
    </div>
  </div>

  <div class="arena-wrap">
    <canvas id="c" width="640" height="400"></canvas>
    <div id="overlay">
      <div id="overlay-title">BEREIT?</div>
      <div class="diff-label">SCHWIERIGKEIT</div>
      <div id="diff-row">
        <button class="diff-btn active" data-d="easy">LEICHT</button>
        <button class="diff-btn" data-d="medium">MITTEL</button>
        <button class="diff-btn" data-d="hard">SCHWER</button>
      </div>
      <button id="start-btn">► START</button>
    </div>
  </div>

  <div class="controls">
    <span><span class="key">W</span> / <span class="key">S</span> — Spieler 1</span>
    <span><span class="key">↑</span> / <span class="key">↓</span> — Spieler 2</span>
  </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const PADDLE_W = 10, PADDLE_H = 70, BALL_SIZE = 10;
const WIN_SCORE = 7;

const DIFF = {
  easy:   { speed: 4, aiSpeed: 2.8 },
  medium: { speed: 6, aiSpeed: 4.2 },
  hard:   { speed: 8, aiSpeed: 6.5 }
};

let diff = 'easy';
let running = false;
let animId;

const state = {
  p1: { y: H/2 - PADDLE_H/2, score: 0, up: false, down: false },
  p2: { y: H/2 - PADDLE_H/2, score: 0, up: false, down: false },
  ball: { x: W/2, y: H/2, vx: 0, vy: 0 },
  particles: []
};

function resetBall(dir = 1) {
  const cfg = DIFF[diff];
  const angle = (Math.random() * 60 - 30) * Math.PI / 180;
  state.ball.x = W / 2;
  state.ball.y = H / 2;
  state.ball.vx = cfg.speed * dir * Math.cos(angle);
  state.ball.vy = cfg.speed * Math.sin(angle);
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 4;
    state.particles.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd, life: 1, color });
  }
}

function updateParticles() {
  state.particles = state.particles.filter(p => p.life > 0);
  state.particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.035;
    p.vx *= 0.96;
  });
}

function drawParticles() {
  state.particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    ctx.restore();
  });
}

function drawNeonRect(x, y, w, h, color) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 18;
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function drawCenterLine() {
  ctx.save();
  ctx.strokeStyle = '#ffffff18';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 10]);
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // background glow corners
  const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 200);
  grad.addColorStop(0, '#00ffe705');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  drawCenterLine();

  // paddles
  drawNeonRect(16, state.p1.y, PADDLE_W, PADDLE_H, '#00ffe7');
  drawNeonRect(W - 16 - PADDLE_W, state.p2.y, PADDLE_W, PADDLE_H, '#ff2d78');

  // ball trail
  ctx.save();
  ctx.shadowColor = '#00ffe7';
  ctx.shadowBlur = 24;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(state.ball.x - BALL_SIZE/2, state.ball.y - BALL_SIZE/2, BALL_SIZE, BALL_SIZE);
  ctx.restore();

  drawParticles();
}

function movePaddles() {
  const spd = 5;
  if (state.p1.up   && state.p1.y > 0)        state.p1.y -= spd;
  if (state.p1.down && state.p1.y < H - PADDLE_H) state.p1.y += spd;
  if (state.p2.up   && state.p2.y > 0)        state.p2.y -= spd;
  if (state.p2.down && state.p2.y < H - PADDLE_H) state.p2.y += spd;
}

function updateBall() {
  const b = state.ball;
  const cfg = DIFF[diff];

  b.x += b.vx;
  b.y += b.vy;

  // wall bounce top/bottom
  if (b.y - BALL_SIZE/2 <= 0) { b.vy = Math.abs(b.vy); spawnParticles(b.x, 0, '#ffffff60'); }
  if (b.y + BALL_SIZE/2 >= H) { b.vy = -Math.abs(b.vy); spawnParticles(b.x, H, '#ffffff60'); }

  // paddle 1 collision
  if (b.x - BALL_SIZE/2 <= 26 + PADDLE_W &&
      b.y >= state.p1.y && b.y <= state.p1.y + PADDLE_H &&
      b.vx < 0) {
    const rel = (b.y - (state.p1.y + PADDLE_H/2)) / (PADDLE_H/2);
    const angle = rel * 55 * Math.PI / 180;
    const spd = Math.min(Math.hypot(b.vx, b.vy) * 1.05, cfg.speed * 1.8);
    b.vx = spd * Math.cos(angle);
    b.vy = spd * Math.sin(angle);
    spawnParticles(b.x, b.y, '#00ffe7');
  }

  // paddle 2 collision
  if (b.x + BALL_SIZE/2 >= W - 26 - PADDLE_W &&
      b.y >= state.p2.y && b.y <= state.p2.y + PADDLE_H &&
      b.vx > 0) {
    const rel = (b.y - (state.p2.y + PADDLE_H/2)) / (PADDLE_H/2);
    const angle = rel * 55 * Math.PI / 180;
    const spd = Math.min(Math.hypot(b.vx, b.vy) * 1.05, cfg.speed * 1.8);
    b.vx = -spd * Math.cos(angle);
    b.vy = spd * Math.sin(angle);
    spawnParticles(b.x, b.y, '#ff2d78');
  }

  // score
  if (b.x < 0) {
    state.p2.score++;
    updateScores();
    if (state.p2.score >= WIN_SCORE) return endGame(2);
    setTimeout(() => resetBall(1), 600);
    b.x = W/2; b.y = H/2; b.vx = 0; b.vy = 0;
  }
  if (b.x > W) {
    state.p1.score++;
    updateScores();
    if (state.p1.score >= WIN_SCORE) return endGame(1);
    setTimeout(() => resetBall(-1), 600);
    b.x = W/2; b.y = H/2; b.vx = 0; b.vy = 0;
  }
}

function updateScores() {
  document.getElementById('s1').textContent = String(state.p1.score).padStart(2,'0');
  document.getElementById('s2').textContent = String(state.p2.score).padStart(2,'0');
}

function endGame(winner) {
  running = false;
  cancelAnimationFrame(animId);
  const ov = document.getElementById('overlay');
  const ot = document.getElementById('overlay-title');
  ot.innerHTML = winner === 1
    ? `SPIELER 1\nGEWINNT!`
    : `SPIELER 2\nGEWINNT!`;
  ot.style.color = winner === 1 ? '#00ffe7' : '#ff2d78';
  document.getElementById('start-btn').textContent = '► NOCHMAL';
  ov.classList.remove('hidden');
}

function loop() {
  if (!running) return;
  movePaddles();
  updateBall();
  updateParticles();
  draw();
  animId = requestAnimationFrame(loop);
}

function startGame() {
  state.p1.y = H/2 - PADDLE_H/2; state.p1.score = 0; state.p1.up = false; state.p1.down = false;
  state.p2.y = H/2 - PADDLE_H/2; state.p2.score = 0; state.p2.up = false; state.p2.down = false;
  state.particles = [];
  updateScores();
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('overlay-title').style.color = '';
  running = true;
  resetBall(Math.random() < 0.5 ? 1 : -1);
  loop();
}

// controls
document.addEventListener('keydown', e => {
  if (e.key === 'w' || e.key === 'W') state.p1.up = true;
  if (e.key === 's' || e.key === 'S') state.p1.down = true;
  if (e.key === 'ArrowUp')   { state.p2.up = true; e.preventDefault(); }
  if (e.key === 'ArrowDown') { state.p2.down = true; e.preventDefault(); }
});
document.addEventListener('keyup', e => {
  if (e.key === 'w' || e.key === 'W') state.p1.up = false;
  if (e.key === 's' || e.key === 'S') state.p1.down = false;
  if (e.key === 'ArrowUp')   state.p2.up = false;
  if (e.key === 'ArrowDown') state.p2.down = false;
});

document.getElementById('start-btn').addEventListener('click', startGame);

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    diff = btn.dataset.d;
  });
});

// initial draw
draw();
</script>
</body>
</html>
