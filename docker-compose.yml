version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       appdb
      POSTGRES_USER:     appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST:     db
      DB_NAME:     appdb
      DB_USER:     appuser
      DB_PASSWORD: apppassword
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
