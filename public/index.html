<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Light App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #16213e;
      border-radius: 12px;
      padding: 2.5rem 3rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    h1 { font-size: 1.2rem; color: #aaa; margin-bottom: 1.5rem; }

    .count {
      font-size: 4rem;
      font-weight: bold;
      color: #e94560;
      line-height: 1;
    }

    .label {
      color: #555;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      margin-top: 1.5rem;
    }

    .dot.ok    { background: #2ecc71; }
    .dot.error { background: #e94560; }
  </style>
</head>
<body>
  <div class="card">
    <h1>OPENSHIFT LIGHT APP</h1>
    <div class="count" id="count">–</div>
    <div class="label">Seitenbesuche</div>
    <div class="dot" id="dot"></div>
  </div>

  <script>
    async function ping() {
      try {
        const res = await fetch('/api/ping');
        const data = await res.json();
        document.getElementById('count').textContent = data.visits;
        document.getElementById('dot').className = 'dot ok';
      } catch {
        document.getElementById('dot').className = 'dot error';
      }
    }
    ping();
  </script>
</body>
</html>
